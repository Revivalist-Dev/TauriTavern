name: Stable Release

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag, for example v2.2.0
        required: true
        type: string

concurrency:
  group: stable-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      previous_sha: ${{ steps.release.outputs.previous_sha }}
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag=${EVENT_TAG:-$INPUT_TAG}
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Validate stable release identity
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          release_json=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,tagName)
          test "$(jq -r '.isDraft' <<< "$release_json")" = false
          test "$(jq -r '.isPrerelease' <<< "$release_json")" = false
          test "$(jq -r '.tagName' <<< "$release_json")" = "$RELEASE_TAG"

          version=$(node scripts/ci/verify-release-version.mjs "$RELEASE_TAG")
          commit=$(git rev-parse HEAD)
          previous_tag=
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              previous_tag=$candidate
              break
            fi
          done < <(git tag --merged "$commit^" --sort=-version:refname)
          test -n "$previous_tag"
          previous_sha=$(git rev-parse "$previous_tag^{commit}")
          {
            echo "tag=$RELEASE_TAG"
            echo "version=$version"
            echo "commit=$commit"
            echo "previous_sha=$previous_sha"
          } >> "$GITHUB_OUTPUT"

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target_args: ""
            artifact_prefix: ""
          - platform: windows-latest
            target_args: --debug --bundles nsis --features devtools-pilot
            artifact_prefix: debug-

    runs-on: ${{ matrix.platform }}
    env:
      TAURITAVERN_BUILD_BRANCH: main
      TAURITAVERN_BUILD_REVISION: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with: {}
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Build desktop bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri/crates/tauritavern
          tauriScript: node ../../../scripts/tauri-app.mjs
          args: ${{ matrix.target_args }}
          uploadWorkflowArtifacts: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          workflowArtifactNamePattern: TauriTavern-${{ needs.prepare.outputs.version
            }}-${{ matrix.artifact_prefix }}[platform]-[arch]-[bundle]

  portable:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows-x64

    runs-on: ${{ matrix.platform }}
    env:
      TAURITAVERN_BUILD_BRANCH: main
      TAURITAVERN_BUILD_REVISION: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Build portable binary
        run: node scripts/build-portable.mjs --output-dir portable
      - name: Upload portable binary
        uses: actions/upload-artifact@v7
        with:
          name: TauriTavern-${{ needs.prepare.outputs.version }}-${{ matrix.name
            }}-portable
          path: portable/*
          if-no-files-found: error

  publish-release:
    needs:
      - prepare
      - desktop
      - portable
    # Windows-only release train.
    if: ${{ !cancelled() && needs.prepare.result == 'success' &&
      needs.desktop.result == 'success' && needs.portable.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      ASSET_PREFIX: TauriTavern-${{ needs.prepare.outputs.version }}-
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          path: source

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          pattern: 'TauriTavern-${{ needs.prepare.outputs.version }}-*'
          path: dist

      - name: Validate and collect release assets
        run: node source/scripts/ci/collect-release-assets.mjs dist release-assets
          "$ASSET_PREFIX" --require-debug

      - name: Upload assets without changing release notes
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f -name "${ASSET_PREFIX}*" -print0 \
            | xargs -0 gh release upload "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber

  publish-winget:
    needs: [ prepare, publish-release ]
    if: ${{ !cancelled() && needs.publish-release.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/winget-release.yml
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}
    secrets:
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
