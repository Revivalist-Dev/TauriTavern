name: PR quality gate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: checks-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install latest stable Rust and Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Windows-only scope
        shell: pwsh
        run: node scripts/check-windows-only.mjs
      - name: Run checks and tests
        run: pnpm run check
