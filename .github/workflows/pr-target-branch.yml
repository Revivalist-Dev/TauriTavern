name: PR target branch

on:
  pull_request_target:
    # Reopening is the explicit exception for urgent fixes.
    types: [opened]

permissions:
  pull-requests: write

jobs:
  check-target:
    if: github.event.pull_request.base.ref != 'dev'
    runs-on: windows-latest
    steps:
      - name: Explain the contribution policy and close the PR
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const guide = `https://github.com/${owner}/${repo}/blob/dev/CONTRIBUTING.md`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body: `Thank you for contributing to TauriTavern! Regular PRs should target \`dev\`. This PR will be automatically closed because it targets another branch. Please read [CONTRIBUTING.md](${guide}), change the target branch to \`dev\`, and reopen the PR. If this is an urgent fix that must go directly to \`main\`, please explain why and reopen this PR.`,
            });

            await github.rest.pulls.update({ owner, repo, pull_number, state: 'closed' });
