name: Feature request
description: Propose an improvement grounded in a concrete use case
title: "[Feature] "
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem and the outcome you want. Implementation ideas are useful context; the final design will also account for the project architecture, the SillyTavern ecosystem, and platform constraints.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who encounters the problem, in what situation, and why does the current behavior fall short?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe what the user should be able to accomplish.
    validations:
      required: true

  - type: textarea
    id: use_cases
    attributes:
      label: Use cases
      description: Give one or two concrete examples and note the affected platforms or users.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Current alternatives
      description: If a workaround exists, describe its limitations.
    validations:
      required: false

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and tradeoffs
      description: Note any effects on existing data, the SillyTavern extension ecosystem, or particular platforms.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sketches, screenshots, public references, or implementation ideas if useful.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find the same request.
          required: true
