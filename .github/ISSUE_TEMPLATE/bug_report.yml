name: Bug report
description: Report a reproducible TauriTavern problem
title: "[Bug] "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide reliable reproduction steps and remove API keys, chat content, and other private information before submitting.

        Before filing, disable all third-party extensions and test again. If the problem disappears, you may still report it as a compatibility issue; name the extension involved.

        Compatibility problems involving SillyTavern extensions, themes, or character cards are welcome. State whether the problem depends on that content and include its name or a public link.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: TauriTavern version
      description: Enter a release, prerelease, or commit hash.
      placeholder: "2.1.1"
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: System and device
      description: Include the Windows version and build. Add the WebView version if known.
      placeholder: Windows 11 23H2 (22631), WebView2 138
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation source
      options:
        - Official release
        - Official prerelease
        - Self-built
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Start from a known app state and list each action in order.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Click ...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Describe what the app did.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Describe the behavior you expected.
    validations:
      required: true

  - type: dropdown
    id: third_party
    attributes:
      label: Third-party extensions and content
      description: Disable all third-party extensions, test again, and select the result. If you cannot test, explain why under Relevant configuration.
      options:
        - Reproduces with third-party extensions disabled
        - No longer reproduces with third-party extensions disabled
        - Unable to test
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Relevant configuration
      description: Include the provider, model, Agent mode, sync mode, chat size, or related extension, theme, or card when relevant.
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Logs and attachments
      description: Add frontend or backend logs, screenshots, or a recording. Remove private information first.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find the same problem.
          required: true
        - label: I removed API keys, chat content, and other private information from attached material.
          required: true
